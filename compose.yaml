name: merp

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Run a real query over TCP as the app user. TCP matters: during first-run
      # initialisation Postgres listens on its Unix socket only, then restarts.
      test:
        - CMD-SHELL
        - >-
          PGPASSWORD="$$POSTGRES_PASSWORD" psql -h 127.0.0.1 -U "$$POSTGRES_USER"
          -d "$$POSTGRES_DB" -c "SELECT 1"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    # No published ports: only reachable from other services on this network.

  backend:
    build:
      context: ./backend
      target: runtime
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # One-shot schema migration. Never started by "up"; run it explicitly:
  #   docker compose --profile migrate run --rm --build migrate
  migrate:
    build:
      context: ./backend
      target: runtime
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    profiles: ["migrate"]

  tests:
    build:
      context: ./backend
      target: test
    profiles: ["test"]

volumes:
  postgres_data:
