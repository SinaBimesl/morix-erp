[project]
name = "merp-backend"
version = "0.1.0"
description = "Guitar workshop management system - backend core"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "email-validator>=2.4.0",
    "fastapi>=0.162.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "I"]

[tool.ruff.lint.per-file-ignores]
# Alembic writes revisions from its own template. Check them for real errors
# (undefined names, unused imports) but not for style.
"migrations/versions/*" = ["E501", "UP", "I"]

[tool.ruff.format]
exclude = ["migrations/versions/*"]
